<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:630px;background:#f7f2e6;font-family:'Inter',sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:0 96px;position:relative;overflow:hidden;}
  .eyebrow{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#2c4be0;margin-bottom:26px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:128px;line-height:.98;letter-spacing:-.03em;color:#1c2436;}
  .sub{margin-top:30px;font-size:30px;color:#4a5570;font-weight:400;}
  .sig{margin-top:44px;font-size:24px;color:#8791a8;}
  .band{position:absolute;left:0;bottom:0;width:100%;height:14px;background:#2c4be0;}
</style>
</head>
<body>
  <p class="eyebrow">A note from Jacob</p>
  <h1>Hey Sean.</h1>
  <p class="sub">From one Cincinnati builder to another.</p>
  <p class="sig">Not a pitch. Just a note.</p>
  <div class="band"></div>
</body>
</html>
